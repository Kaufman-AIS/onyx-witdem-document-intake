[project]
name = "witdem-onyx-demo"
version = "0.1.0"
description = "Agency showcase: self-hosted Onyx knowledge brain with Witdem audit analytics"
requires-python = ">=3.10,<3.14"
dependencies = [
  "witdem-sdk==0.2.2",
  "httpx>=0.27,<1",
  "pyyaml>=6,<7",
  "python-dotenv>=1,<2",
  "starlette>=0.40,<1",
  "uvicorn>=0.30,<1",
  "haystack-ai>=2.6,<3",
  "google-api-python-client>=2.140,<3",
  "google-auth>=2.30,<3",
  "google-auth-oauthlib>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/witdem_onyx_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
