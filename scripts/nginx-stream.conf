worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

# Detect TLS vs plain HTTP on the same host port (3000) and route accordingly.
# Browsers with cached HSTS hit TLS → uvicorn :8443; plain http:// works → uvicorn :8080.
stream {
    map $ssl_preread_protocol $upstream {
        default backend_http;
        "TLSv1.0" backend_https;
        "TLSv1.1" backend_https;
        "TLSv1.2" backend_https;
        "TLSv1.3" backend_https;
    }

    upstream backend_http {
        server 127.0.0.1:8080;
    }

    upstream backend_https {
        server 127.0.0.1:8443;
    }

    server {
        listen 3000;
        ssl_preread on;
        proxy_pass $upstream;
    }
}
