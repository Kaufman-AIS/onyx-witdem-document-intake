services:
  witdem-proxy:
    ports: !override
      # Host :3000 is used by srs-1 Shopware; use free localhost ports in prod.
      - "127.0.0.1:3020:3000"
      - "127.0.0.1:3021:8080"
    environment:
      WITDEM_ENDPOINT: http://witdem:4318
    restart: unless-stopped

  nginx:
    ports: !override
      - "127.0.0.1:13000:80"

  intake:
    build:
      context: ${ONYX_DEMO_ROOT:-.}
      dockerfile: Dockerfile.intake
    image: onyx-witdem-intake:local
    env_file:
      - ${ONYX_DEMO_ROOT:-.}/.env
    environment:
      WITDEM_ENDPOINT: http://witdem:4318
      WITDEM_CONFIG: /app/witdem.yml
      ONYX_API_BASE_URL: http://api_server:8080
      INTAKE_USE_MEMORY: ${INTAKE_USE_MEMORY:-0}
    ports:
      - "127.0.0.1:8091:8091"
    networks:
      - default
      - witdem_default
    restart: unless-stopped
    volumes:
      - ${ONYX_DEMO_ROOT:-.}/secrets:/run/secrets:ro
