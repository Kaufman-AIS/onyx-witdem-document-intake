name: Deploy Hostinger

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ONYX_API_KEY: ${{ secrets.ONYX_API_KEY }}
          ONYX_PERSONA_ID: ${{ secrets.ONYX_PERSONA_ID }}
          WITDEM_API_KEY: ${{ secrets.WITDEM_API_KEY }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
          GOOGLE_TASKS_LIST_ID: ${{ secrets.GOOGLE_TASKS_LIST_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          INTAKE_USE_MEMORY: ${{ secrets.INTAKE_USE_MEMORY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # appleboy/ssh-action defaults to 22; GHA has no secrets.X || default.
          # For a non-default port, set port: ${{ secrets.SSH_PORT }} and define SSH_PORT.
          port: 22
          command_timeout: 45m
          envs: OPENAI_API_KEY,ONYX_API_KEY,ONYX_PERSONA_ID,WITDEM_API_KEY,GOOGLE_DRIVE_ROOT_FOLDER_ID,GOOGLE_TASKS_LIST_ID,GOOGLE_OAUTH_CLIENT_ID,GOOGLE_OAUTH_CLIENT_SECRET,GOOGLE_OAUTH_REFRESH_TOKEN,INTAKE_USE_MEMORY
          script: |
            set -euo pipefail
            APP=/opt/onyx-witdem-document-intake
            if [[ ! -d "$APP/.git" ]]; then
              sudo mkdir -p /opt
              sudo git clone https://github.com/Kaufman-AIS/onyx-witdem-document-intake.git "$APP"
              sudo chown -R "$USER:$USER" "$APP"
            fi
            cd "$APP"
            git fetch origin main
            git reset --hard origin/main
            ./scripts/deploy-remote.sh
